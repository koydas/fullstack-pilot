version: "3.9"
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fullstack-pilot-mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required (set it in .env)}
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql

  mongo:
    build: ./databases/mongo-db
    container_name: fullstack-pilot-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: fullstack-pilot
    volumes:
      - mongo-data:/data/db

  apps-service:
    build: ./services/apps-service
    container_name: fullstack-pilot-apps-service
    environment:
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/fullstack-pilot
    depends_on:
      - mongo
    ports:
      - "4000:4000"

  postgres:
    build: ./databases/postgre
    container_name: fullstack-pilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fullstack-pilot
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required (set it in .env)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (set it in .env)}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  services-service:
    build: ./services/services-service
    container_name: fullstack-pilot-services-service
    environment:
      PORT: 5000
      POSTGRES_DSN: host=postgres port=5432 dbname=fullstack-pilot user=${POSTGRES_USER} password=${POSTGRES_PASSWORD}
    depends_on:
      - postgres
    ports:
      - "5000:5000"

  dependencies-service:
    build: ./services/dependencies-service
    container_name: fullstack-pilot-dependencies-service
    environment:
      ASPNETCORE_URLS: http://+:6060
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DependenciesDb: Server=mssql,1433;Database=DependenciesDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required (set it in .env)};TrustServerCertificate=True;
    depends_on:
      - mssql
    ports:
      - "6060:6060"


  agent-service:
    build: ./services/agent-service
    container_name: fullstack-pilot-agent-service
    environment:
      PORT: 7000
      APPS_SERVICE_BASE_URL: http://apps-service:4000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN:-dev-agent-token}
    depends_on:
      - apps-service
    ports:
      - "7000:7000"

  client:
    build: ./client
    container_name: fullstack-pilot-client
    depends_on:
      - apps-service
    ports:
      - "5173:80"

volumes:
  mongo-data:
    driver: local
  mssql-data:
    driver: local
  postgres-data:
    driver: local
