name: Build frontend image

on:
  push:
    branches: ["main"]
    paths:
      - "client/**"
      - ".devops/runtime-version.js"
      - ".github/workflows/build-frontend.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "client/**"
      - ".devops/runtime-version.js"
      - ".github/workflows/build-frontend.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  FRONTEND_IMAGE_NAME: fullstack-pilot-frontend

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve Node.js version from Dockerfile
        id: runtime
        run: |
          version=$(node .devops/runtime-version.js client/Dockerfile node)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.runtime.outputs.version }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: client

      - name: Run frontend lint
        run: npm run lint
        working-directory: client

      - name: Run frontend tests
        run: npm test
        working-directory: client

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.FRONTEND_IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}
