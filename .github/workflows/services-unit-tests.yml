name: Services unit tests

on:
  push:
    branches: ["main"]
    paths:
      - "services/**"
      - ".devops/runtime-version.js"
      - ".github/workflows/services-unit-tests.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "services/**"
      - ".devops/runtime-version.js"
      - ".github/workflows/services-unit-tests.yml"
  workflow_dispatch:

jobs:
  apps-service-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve Node.js version from Dockerfile
        id: runtime
        run: |
          version=$(node .devops/runtime-version.js services/apps-service/Dockerfile node)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.runtime.outputs.version }}
          cache: npm
          cache-dependency-path: services/apps-service/package-lock.json

      - name: Install apps-service dependencies
        run: npm ci
        working-directory: services/apps-service

      - name: Run apps-service unit tests
        run: npm test
        working-directory: services/apps-service

  agent-service-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve Node.js version from Dockerfile
        id: runtime
        run: |
          version=$(node .devops/runtime-version.js services/agent-service/Dockerfile node)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.runtime.outputs.version }}

      - name: Install agent-service dependencies
        run: npm install --no-audit --no-fund
        working-directory: services/agent-service

      - name: Run agent-service unit tests
        run: npm test
        working-directory: services/agent-service


  services-service-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve Python version from Dockerfile
        id: runtime
        run: |
          version=$(node .devops/runtime-version.js services/services-service/Dockerfile python)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.runtime.outputs.version }}
          cache: "pip"
          cache-dependency-path: services/services-service/requirements.txt

      - name: Install services-service dependencies
        run: pip install -r requirements.txt
        working-directory: services/services-service

      - name: Run services-service unit tests
        run: python -m unittest tests/test_routes.py
        working-directory: services/services-service

  dependencies-service-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve .NET SDK version from Dockerfile
        id: runtime
        run: |
          version=$(node .devops/runtime-version.js services/dependencies-service/Dockerfile dotnet)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ steps.runtime.outputs.version }}

      - name: Restore dependencies-service
        run: dotnet restore
        working-directory: services/dependencies-service

      - name: Build dependencies-service
        run: dotnet build --no-restore --configuration Release
        working-directory: services/dependencies-service
