name: Smoke tests

on:
  push:
    branches: ["main"]
    paths:
      - "docker-compose.yml"
      - "services/**"
      - "client/**"
      - ".devops/tests/smoke/**"
      - ".github/workflows/smoke-tests.yml"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Build and start stack
        env:
          COMPOSE_DOCKER_CLI_BUILD: 1
          DOCKER_BUILDKIT: 1
          MSSQL_SA_PASSWORD: CiSmoke_Strong!Passw0rd1
          POSTGRES_USER: fullstack
          POSTGRES_PASSWORD: fullstack
        run: |
          docker compose up -d --build

      - name: Run smoke tests
        env:
          SMOKE_RETRIES: 10
          SMOKE_RETRY_DELAY_MS: 2000
          SMOKE_TIMEOUT_MS: 5000
          SMOKE_POSTGRES_URL: postgres://fullstack:fullstack@localhost:5432/fullstack-pilot
          SMOKE_MSSQL_URL: mssql://sa:CiSmoke_Strong!Passw0rd1@localhost:1433
        run: npm run test:smoke

      - name: Dump service logs on failure
        if: failure()
        env:
          MSSQL_SA_PASSWORD: CiSmoke_Strong!Passw0rd1
          POSTGRES_USER: fullstack
          POSTGRES_PASSWORD: fullstack
        run: |
          docker compose ps
          docker compose logs

      - name: Tear down stack
        if: always()
        env:
          MSSQL_SA_PASSWORD: CiSmoke_Strong!Passw0rd1
          POSTGRES_USER: fullstack
          POSTGRES_PASSWORD: fullstack
        run: docker compose down --volumes
