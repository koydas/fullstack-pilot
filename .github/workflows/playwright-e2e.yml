name: Playwright E2E

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund
        working-directory: client

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: client

      # No docker compose startup is required for this workflow because the
      # Playwright E2E spec intercepts and mocks the backend API routes
      # (for example, **/api/apps and **/api/apps/* in client/e2e/app-workflow.spec.js).
      - name: Run Playwright tests (frontend with mocked API)
        run: npm run test:e2e
        working-directory: client
